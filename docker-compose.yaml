version: '3.8'

services:
  db:
    image: postgis/postgis:latest
    restart: always
    environment:
      POSTGRES_DB: plyaska
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  db_data: